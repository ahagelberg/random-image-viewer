[package]
name = "random-image-viewer"
version = "2.0.0"
edition = "2024"
description = "A cross-platform application for viewing images in random order from selected folders"
license = "MIT"

[dependencies]
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "ico"] }
image-webp = "0.2"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
walkdir = "2"
rayon = "1"
# Used on Linux to force the X11 (XWayland) backend so window position can be saved.
winit = "0.30"
humantime = "2.4.0"

[profile.release]
lto = true
codegen-units = 1

# Decoding a large image takes seconds when the image decoders are unoptimized.
# Dependencies are therefore built optimized in debug builds too; the app crate
# stays unoptimized so it still rebuilds quickly.
[profile.dev.package."*"]
opt-level = 3
